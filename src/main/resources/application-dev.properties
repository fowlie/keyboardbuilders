# Active only under `./gradlew bootRun`, which sets this profile.
#
# jte compiles the .kte templates in `gg.jte.template-location` on each request when
# they change, so a template edit shows up on a browser refresh. It needs the Kotlin
# compiler on the classpath -- that is the `developmentOnly("gg.jte:jte-kotlin")` line
# in build.gradle.kts, and it is why this cannot be the default: tests and the
# packaged jar have no compiler and must use the precompiled classes.
#
# `use-precompiled-templates` must be turned back off explicitly. jte throws if both
# it and development mode are set.
gg.jte.development-mode=true
gg.jte.use-precompiled-templates=false
gg.jte.trim-control-structures=true

# The banner is ten lines of ASCII art, and devtools reprints it on every restart. Off
# in dev only -- it stays wherever a startup is a rare enough event to be worth marking.
spring.main.banner-mode=off

# Rebuild the database from the seed on every start. Dev only: production is shipped a
# database built here, so re-importing there would redo work already done. Safe to run
# every time because the import is idempotent, which has its own test.
keyboardbuilders.import-on-startup=true

# The parts module (#112) and its build list at /designs/{slug}/build. Local only until
# the owner says otherwise: production has no such line, so the route is a 404 there.
keyboardbuilders.parts.enabled=true

# /dev/sign-in-as?login=<github login>: be any designer without GitHub (#116). Dev only;
# DevSignInController also refuses the prod profile.
keyboardbuilders.dev-sign-in=true

# The real GitHub sign-in on this machine: a dev OAuth app's id and secret, kept in a
# gitignored file beside build.gradle.kts. Without the file, sign-in-as above still works.
#   KB_GITHUB_CLIENT_ID=...
#   KB_GITHUB_CLIENT_SECRET=...
spring.config.import=optional:file:./github-dev.env[.properties]
