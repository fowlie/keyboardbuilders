# Active only when the unit sets SPRING_PROFILES_ACTIVE=prod. Forgejo #26.
#
# THE DATABASE PATH IS ABSOLUTE AND ENVIRONMENT-DRIVEN, and that is the whole reason this
# file exists. The default `jdbc:sqlite:./app.db` resolves against the process working
# directory, which under systemd is `/` unless the unit says otherwise. A service started
# that way does not fail: it CREATES an empty database somewhere nobody looks, Flyway
# migrates it happily, and the site serves zero designs with a 200 and no error in the
# log. Making the path depend on how the process was launched is the bug; `WorkingDirectory=`
# would paper over it, an absolute path removes it.
spring.datasource.url=jdbc:sqlite:${KB_DATABASE:/var/lib/keyboardbuilders/app.db}?foreign_keys=on

# ONE ARTEFACT, NOT TWO. Ticket 26 weighed shipping a prebuilt `app.db` beside the jar
# against rebuilding from the seed on boot, and the seed is inside the jar already: the
# jar alone is then self-sufficient, and there is no way to ship a jar and a database
# that disagree about the corpus. Safe because the import is idempotent, which has its
# own test rather than being asserted here.
#
# Cost, stated so it is a choice and not a surprise: every restart re-imports, so a boot
# is as slow as an import, and anything a human wrote into the database directly is
# overwritten. Neither matters yet -- there are no user-authored rows in v0.5. The day
# accounts exist, this flips to false and the deploy grows a second artefact.
keyboardbuilders.import-on-startup=true

# WHERE 3D RENDERS ARE CACHED AFTER A BUCKET FETCH, and it MUST be under the one path this
# unit can write to -- `ProtectSystem=strict` below makes everything else read-only,
# `/opt/keyboardbuilders` included, so the code's own default of `build/renders` (relative
# to WorkingDirectory) was silently unwritable in production. The result before this was
# set: every request for a render asset re-fetched it from Hetzner from cold, with no
# connection reuse, measured at 8-10 seconds per PNG -- on every view, forever, because
# nothing was ever kept. Same directory family as `spring.datasource.url` above, for the
# same reason: it is the one place this service is allowed to persist anything.
keyboardbuilders.renders.dir=${KB_RENDERS_DIR:/var/lib/keyboardbuilders/renders}

# SAME REASON, SAME FAMILY, FOR APPROVED PHOTOS -- backlog #101. `ReadWritePaths` below is
# the whole `/var/lib/keyboardbuilders` directory already, so this needs no unit change,
# only the same absolute-path discipline every other persisted thing here follows.
keyboardbuilders.photos.dir=${KB_PHOTOS_DIR:/var/lib/keyboardbuilders/photos}

# THE MODERATOR QUEUE, backlog #117: the file the intake bot writes and the app only reads.
# Missing until 2026-11-15, the night it shipped: the default is relative, so the app looked
# under /opt/keyboardbuilders/data/ and showed an empty queue while the bot's 20 questions
# sat here.
keyboardbuilders.moderation.questions=${KB_MODERATION_QUESTIONS:/var/lib/keyboardbuilders/moderation/questions.json}
keyboardbuilders.moderation.checked=${KB_MODERATION_CHECKED:/var/lib/keyboardbuilders/moderation/checked.json}

# NOTHING FACES THE INTERNET DIRECTLY, and the bind address is how that is enforced --
# but WHICH private address depends on where the proxy runs, so it is environment-driven.
#
# Loopback is right when the proxy is a process on the same host. It is WRONG when the
# proxy is a CONTAINER: a container reaches the host over the docker bridge gateway, not
# over the host's loopback, so a service on 127.0.0.1 is invisible to it. On this VPS
# Caddy runs as `caddy:2-alpine` with `host.docker.internal:host-gateway`, and the first
# deploy failed exactly here.
#
# So bind to the bridge gateway (KB_ADDRESS=172.17.0.1 or whatever `docker network
# inspect bridge` reports). That is reachable by containers on this host and is not
# routable from the internet, which keeps the guarantee the loopback default was making.
# Do NOT set this to 0.0.0.0 unless a firewall is closing the port -- this box already
# has 8081 open to the world, so there is no firewall doing it for you.
server.address=${KB_ADDRESS:127.0.0.1}
server.port=${KB_PORT:8080}

# The dev profile turns on jte development mode, which needs the Kotlin compiler on the
# classpath -- absent from the packaged jar. That combination does not fail at boot, it
# fails at the FIRST RENDER, so a smoke test that only checks the process is alive would
# pass. Stated here as the thing to check when a deploy 500s on every page.
gg.jte.use-precompiled-templates=true

# Behind a proxy, the app sees the proxy's address and scheme unless it is told to read
# the forwarded headers. Without this every absolute URL the app generates says `http`
# and localhost, which breaks redirects the moment one is added.
server.forward-headers-strategy=native

# A shutdown that drops in-flight requests is a 502 for whoever was mid-page. The unit
# gives it time to drain.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# -- Monitoring, Forgejo #28 -----------------------------------------------------------
#
# A SEPARATE PORT, ON LOOPBACK, AND THAT IS WHAT MAKES `show-details` SAFE. With details
# on, /actuator/health names each component's state and /actuator/metrics enumerates the
# app's internals; either is an information leak to whoever asks. The management server
# therefore listens on its own port that the reverse proxy never publishes, bound to
# 127.0.0.1 so it is not even reachable from the docker bridge -- unlike the app itself,
# which must be reachable there for Caddy.
#
# StatLite runs as a host process on this box and polls it over loopback. Caddy is also
# told to refuse /actuator* on the public site, which is belt to this braces: it means a
# later change to these properties cannot quietly expose the endpoints.
#
# THE ADDRESS IS ENVIRONMENT-DRIVEN FOR THE SAME REASON `server.address` IS, and it was
# hard-coded until 2026-09-07, which made the app impossible to containerise without
# losing monitoring. Inside a container, `127.0.0.1` is the CONTAINER's loopback: docker
# cannot forward a published port to it, so StatLite would poll a port nothing answers
# and report the app down while it served pages perfectly.
#
# The guarantee is unchanged and simply moves outward. Under systemd the default holds
# and the port is on the host's loopback. Under docker the container binds 0.0.0.0 --
# which is only its own network namespace -- and the compose file publishes it to
# `127.0.0.1:9091` on the host, so what is reachable from outside is identical either way.
# Setting this to 0.0.0.0 WITHOUT a published-address restriction in front of it would
# expose the actuator, which `show-details=always` makes a real leak.
management.server.port=${KB_MANAGEMENT_PORT:9091}
management.server.address=${KB_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# The signed-in designer's session cookie (#116) goes over https only. Not in the base
# file, because the dev server is plain http on localhost.
server.servlet.session.cookie.secure=true
