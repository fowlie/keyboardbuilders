spring.application.name=keyboardbuilders

# The templates are Kotlin (.kte), not Java (.jte). The view resolver appends this
# suffix to the view name, and its default (.jte) silently misses every template we
# have -- the request then falls through to the servlet forward and renders nothing.
gg.jte.template-suffix=.kte

# Kotlin templates cannot be compiled at runtime without the Kotlin compiler on the
# classpath, so we use the classes the Gradle `generateJte` task already produces.
# Cost: a template edit needs a rebuild. `./gradlew build --continuous` plus devtools
# covers that.
gg.jte.use-precompiled-templates=true

# `foreign_keys` is a per-CONNECTION pragma in SQLite and defaults to OFF, so arming it
# in a migration or a startup statement would arm it for that one connection and no
# other. On the URL, every connection the pool opens gets it. Without this the FKs in
# the schema are documentation rather than enforcement.
spring.datasource.url=jdbc:sqlite:./app.db?foreign_keys=on

# Flyway applies db/migration on startup. See the build file for why a migration tool
# is here at all when the deployed database is rebuilt from scratch every time.

# The designs index is 85% inline SVG and the markup is the same handful of attributes
# with different numbers, which is the shape gzip is best at: 428 KB becomes 23 KB, and
# 934 KB becomes 32 KB at the ~300-design target. Measured on this page, not assumed.
#
# The floor matters as much as the switch. `ux.md` 2.7 settles on htmx swapping
# fragments, and gzipping a 200-byte fragment costs CPU to save nothing. Below 1024
# bytes Tomcat sends the body as it is -- the home page, at 591 bytes, is the case that
# proves it.
#
# Compression does nothing for parse or layout time, which is the real cost of the
# full-page swap. That is Forgejo #13, and it is a different lever.
server.compression.enabled=true
# `application/xml` for the sitemap, which is 236 URLs of highly repetitive markup and was
# going over the wire raw because it was not on this list. `image/svg+xml` for the favicon.
# PNG is absent on purpose: it is already compressed and gzipping it burns CPU to add bytes.
server.compression.mime-types=text/html,text/css,application/javascript,application/xml,image/svg+xml
server.compression.min-response-size=1024

# The reason on a 4xx reaches the error page, which is where `contract.md` 1 always meant
# it to go: "an unreadable query is a 400 WITH THE REASON, never a silent narrowing".
# `DesignsController` has always thrown that reason and the default `never` discarded it.
#
# `on-param` rather than `always` for the STACK TRACE: never in normal operation, and
# available with `?trace=true` when debugging. A 5xx message is whatever the JVM said and
# is never shown -- `ErrorPageController` gates on 4xx, not on this property.
server.error.include-message=always
server.error.include-stacktrace=on-param

# -- Sign in with GitHub, backlog #116 -------------------------------------------------
#
# FROM THE ENVIRONMENT, NEVER THE REPO. The secret lives in the VPS's env beside the
# compose file. The placeholders let the app boot without one, as a dev machine does:
# every page works and only "sign in" fails, at GitHub's end.
#
# Spring knows GitHub's endpoints by the registration id `github`; the callback it
# expects is /login/oauth2/code/github, which is what the OAuth app registers. The
# default scope is `read:user`: the public profile, which is all the login needs.
spring.security.oauth2.client.registration.github.client-id=${KB_GITHUB_CLIENT_ID:unset}
spring.security.oauth2.client.registration.github.client-secret=${KB_GITHUB_CLIENT_SECRET:unset}

# The session cookie exists only for a signed-in designer. Lax, so it is not sent on
# another site's form post; CSRF tokens on /account are the main guard.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Build photo uploads (2026-11-24). Phone photos run 3-12 MB; the default 1 MB refused
# nearly all of them. The server shrinks each one to 1600px wide before keeping it.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
