# Test-only settings, layered over src/main/resources/application.properties.
#
# IN config/, NOT BESIDE IT. Spring Boot reads both classpath:application.properties and
# classpath:config/application.properties, the second winning. A test file at the plain
# path would hide main's file instead of adding to it, and the jte suffix and compression
# settings would vanish from every test.
#
# Backlog #114: every @SpringBootTest that named its own database was its own Spring
# context, so the suite booted the app ~28 times. The database is chosen here now, once,
# and classes that differ only in that share one cached context.

# ONE IN-MEMORY DATABASE PER CONTEXT, never ./app.db. The owner's bootRun uses that file,
# and a test must not write into it or depend on what it happens to hold.
#
# `${random.uuid}` is resolved when the context starts, so two contexts never share a
# database and a fixture context cannot disturb the main one. Spring's context cache keys
# on the annotations, not on this resolved value, so it does not split contexts.
#
# `mode=memory&cache=shared` lets the pool's connections see one database (plain
# `:memory:` gives each connection its own). The database lives as long as one connection
# is open; Hikari keeps its 10 idle, and `max-lifetime=0` stops it retiring them, so the
# database lasts as long as the context does.
spring.datasource.url=jdbc:sqlite:file:kb-test-${random.uuid}?mode=memory&cache=shared&foreign_keys=on
spring.datasource.hikari.max-lifetime=0

# Each context imports the seed once at startup, like bootRun. Tests that wrote rows
# (hearts, offer prices) delete them after themselves; the import is idempotent, so a test
# that re-runs it leaves the same rows behind.
keyboardbuilders.import-on-startup=true

# The parts module (#112) is on, as in the dev profile. BuildListDisabledTest switches it
# off to prove production's 404. The classes that swap in a fixture design or controller
# catalogue switch it off too: the parts seed is checked against those catalogues at
# startup and fails on a fixture. Each of those classes has a context of its own anyway.
keyboardbuilders.parts.enabled=true

# Five hearts an hour per visitor, so HeartControllerTest can reach the limit. Only that
# class sends hearts through the controller.
keyboardbuilders.heart.limit=5

# Sign in with GitHub (#116). Placeholders: no test talks to GitHub, and MockMvc's
# `oauth2Login()` stands in for a signed-in designer.
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
