# Every pull request runs the suite. Nothing here holds a secret: a pull request from a fork
# runs code its author wrote, so this job gets a read-only token and no access to the
# server. Deploying is deploy.yml's job, and that runs only for pushes to main.
name: test
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test
      - name: The scripts' own tests
        working-directory: scripts
        run: for t in test_*.py; do python3 -m unittest "$t"; done
