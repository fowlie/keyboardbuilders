# seed/discoveries.toml -- repos found on GitHub that a moderator ruled on.
# Written by scripts/intake_answer.py from an answer on /moderation (backlog #105,
# #117); read by scripts/intake_ask.py so nothing is asked twice.
#
#   design       an open keyboard design: queued for importing
#   not_design   not one (a keymap, a tool, a case only, ...): never asked again
#
# The build reads nothing here yet. A `design` row publishes nothing by itself;
# it is the queue #105's step 2 (reading firmware inside the repo) works from.
#
# `moderator` is who ruled. `issue = N` is a ruling given as a reply to GitHub issue N,
# before /moderation (#117). The first 29 `moderator = "fowlie"` rows were ruled in a chat
# session on 2026-11-14, while the bot account was hidden, and carried `issue = 0` until
# 2026-11-16.

