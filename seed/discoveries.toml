# seed/discoveries.toml -- repos found on GitHub that the owner ruled on.
# Written by scripts/intake_answer.py from his reply to an `intake/discovery`
# issue (backlog #105); read by scripts/intake_ask.py so nothing is asked twice.
#
#   design       an open keyboard design: queued for importing
#   not_design   not one (a keymap, a tool, a case only, ...): never asked again
#
# The build reads nothing here yet. A `design` row publishes nothing by itself;
# it is the queue #105's step 2 (reading firmware inside the repo) works from.
#
# `issue = 0` marks an answer given in a chat session, not on a GitHub issue
# (2026-11-14, while the bot account was hidden).

[[entry]]
repo = "Meisterschulen-am-Ostbahnhof-Munchen/JC8012P4A1C_I_W_Y_CAN"
verdict = "not_design"
issue = 0

