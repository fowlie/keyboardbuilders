note     = "QMK's own record states no url (manufacturer Bishop Keyboards; its readme names 'BishopKeyboards and That-Canadian' as maintainers, and the board's silkscreen places a Bishop Keyboards logo, so the repo owner matches). Confirmed at HEAD e8476548e9: not a fork, no licence file, 13 stars, one board file (ECO Keyboard/PCB Files/V2.1/Eco-Board.kicad_pcb, beside seven more files under PCB Files: its project, schematic, netlist, cache library, two fp-lib-tables and a one-footprint eco.pretty); the rest of the tree is two case DXFs (ECO Keyboard/Case Files) and the designer's KiCAD Libs footprint library. The board places 59 switch footprints at 59 positions (56 1u MX/Alps plus three 2u), the record declares LAYOUT 56 -- the 2u footprints read as alternates. The repo serves this one row, so the build imports it without a count join. rev2 rather than rev1, and checked against the board: the Pro Micro U1's pad nets on V2.1 give rows D7,B5,B4,E6 and cols D1,D0,D4,C6,B6,B2,B3,B1,F7,F6,F5,F4,D2,D3, eco/rev2's matrix_pins exactly; rev1's rows (B1,B6,B2,B3) are column pins on this board. QMK's readme still says 'Hardware Supported: ECO PCB rev1 Pro Micro', which is stale, not evidence for rev1. No licence file, so the licence reads Unstated (the silkscreen's OSHW logo is not a licence). Ruled: a moderator (fowlie) on /moderation (intake bot, backlog #117)."

[[entry]]
