signal   = "dev-seed"
verdict  = "confirmed"
note     = "QMK's own record states no url, only shop links in its readme (manufacturer K.T.E.C., matches the repo owner ktec-hq). Confirmed at HEAD 091d1d1232: not a fork, GPL-3.0, 123 stars, one board file (ErgoDone.kicad_pcb, beside the ErgoDOX.brd it was converted from). An ErgoDox derivative by its own description ('ErgoDox using pro micro'), one reversible PCB per hand: 42 switch footprints at 42 positions, Pro Micro plus an MCP23017 expander (U2, wired to the 23017 pinout: SCL 12, SDA 13, A0-A2 to GND). The firmware does not quite match that chip: ktec/ergodone drives an MCP23018 (rules.mk 'SRC += mcp23018.c'), and its readme describes K.T.E.C.'s pre-soldered ErgoDone v1.3, while this repo is a through-hole DIY board with a socketed Pro Micro -- possibly the open ancestor of the shipped v1.3 PCB rather than that PCB. The Pro Micro side DOES match the firmware's matrix.c: the seven pins it reads as columns (D3,D2,D4,C6,D7,E6,B4) sit on the board's COL nets and D1/D0 on the expander's SDA/SCL, so the attribution holds; six ROW nets also reach the Pro Micro, but its footprint numbers 28 pads, so which row lands on which pin is unchecked. Its mini-B receptacle J1 is not a host port: J1's data pads join no other pad (each data net is J1's two pad rows and nothing else), and the cable plugs into the Pro Micro's own micro-B. The record declares 76 and 80 (LAYOUT_ergodox, _80); 42 doubled is 84, the extra being alternates. TWO HALVES: the one reversible board places both the Pro Micro and the expander plus a 4-pin 3.5 mm jack, the ErgoDox mechanism (one chip, the far half scanned through the MCP23017) -- the Pando/3w6 shape, where QMK sets no split flag and the build reads one piece unless seed/bodies.toml says otherwise. Ruled: a moderator (fowlie) on /moderation (intake bot, backlog #117)."

