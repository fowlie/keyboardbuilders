# seed/sources.toml -- which repo holds the hardware for a firmware entry.
# Drafted by scripts/draft_sources.py. Every row is `drafted` until a human
# rules on it; the build consumes rows whose verdict is not `drafted`.
#
# `verdict` answers: is this row settled, and how did it settle? Set by
# ticket 26. Three values, and both settled ones are terminal:
#
#   drafted      unsettled -- a machine proposed the row, nobody has ruled
#   confirmed    settled, use it. The human's word, per ticket 15 -- and on
#                a `source = false` row it means "I looked, no repo is known"
#   source_gone  settled, unusable -- the repo 404s, so no clone, no board
#                file, `switch_footprint` Unknown, and the gate declines it
#
# `source` stays the ONLY home for the content -- a repo slug, or `false` for
# no repo known. Nothing states that twice.
#
# `signal` names WHICH source stated the repo: `zmk-url` is a shield's own
# `url:`, `qmk-url` is a record's own `url`. `none` means nothing did.
# `dev-seed` means A HUMAN SUPPLIED IT and this commit is the credential
# (ticket 10's `ImportSource::DevSeed`). It is the one signal that cannot be
# falsified against a tree, so it stays rare on purpose -- if it ever appears
# in the hundreds, something has gone wrong.
#
# Records ruled `no_design` in seed/declines.toml get NO ROW here. That file
# wins; a declined record never publishes, so a source row for it is attention
# nobody should spend.
#
# ZMK rows cover all 63 keyboard shields, including those whose source is
# unknown, because 63 is the whole tree. QMK rows are drafted ONLY for records
# that name a hardware repo -- a `source = false` row for each of the ~3,200
# repo-less records would be a census of designs the publication gate already
# rejects ~95% of the time.
#
# A QMK row with a non-empty `note` failed a check and wants a human's eye
# first. Two checks run: the url owner against the record's own maintainer and
# manufacturer, and whether another record claims the same repo. Neither can
# catch a record citing an ancestor's repo when the ancestor is also the
# maintainer -- see `owner_matches`; the publication gate is the backstop there.

