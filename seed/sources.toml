# -- Backlog #100 batch 1 -------------------------------------------------------
# Ten designs from the mechdb.net triage (backlog #100 /
# the owner's notes), agent-proposed, `verdict =
# "drafted"` -- NOT confirmed. Every one of these ten already has a QMK record
# (found in the local qmk_firmware checkout, commit 330a8597f8, the same one this
# seed is built against) whose own `url` is empty or points to a shop rather than a
# repo, so a normal `qmk-url` draft could never have found them -- exactly the
# Scotto shape, `signal = "dev-seed"`, this commit the credential.
#
# WHAT WAS CHECKED, AND WHAT WAS NOT. For each, the proposed `source` repo was
# confirmed to exist, not be a fork, and hold at least one real `.kicad_pcb` or
# gerber file -- read directly off GitHub's git-tree API, not inferred from a
# README or a web search. (The mechdb triage workflow's web-search-only verdicts
# turned out wrong often enough to be worth the extra check: it called
# `KGOH/Jian-Info` and `obosob/arch-36` "candidates" on README text alone, and
# both are firmware-only or hardware-less on inspection.) NOT checked: switch
# footprint family, licence file placement, or whether any of these ten repos
# secretly holds more than one design -- that is exactly what `scan_boards.py`
# and a human's ruling are for, and no row here claims to have done that work.
