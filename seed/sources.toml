# -- tree = "hardware" ---------------------------------------------------------
# A design whose repo NO FIRMWARE RECORD NAMES. Forgejo #22.
#
# `(tree, id)` is unique and, for the other two trees, IS a firmware identity -- so a
# repo can only enter by being named by a record. Many records may share one repo
# (`foostan/crkbd` has seven rows); one record may not name two repos. A hardware fork
# needs exactly that second thing: Cantor Remix ships its own PCB and reuses Cantor's
# QMK firmware unchanged, so it never becomes a QMK board and no row can reach it.
#
# A hardware row therefore states what the other trees read from a record:
#   `firmware`  the row whose firmware this design runs, as `tree:id`
#   `keys`      the design's key count -- ASSERTED BY A HUMAN AND CHECKED BY THE BUILD
#               against the board's own placed switches. It cannot be derived alone: a
#               split design whose board file holds both halves already places the full
#               count, and doubling it would publish twice the keyboard.
#
# `signal = "dev-seed"` is the honest signal and this file's header already defines it:
# a human supplied it and this commit is the credential. It is the one signal that
# cannot be falsified against a tree, which is why the parts that CAN be checked are.
[[entry]]
tree = "hardware"
id = "cantor-remix"
name = "Cantor Remix"
source = "nilokr/cantor-remix"
firmware = "qmk:cantor"
keys = 36
path = false
stated = "https://github.com/nilokr/cantor-remix"
signal = "dev-seed"
verdict = "confirmed"
note = "36-key fork of Cantor, one column fewer per hand, running Cantor's QMK firmware unchanged. GitHub states fork parentage diepala/cantor and the repo describes itself as 'Cantor keyboard by diepala with minor changes' -- a based_on credit the domain does not model yet (map.md:189)."

