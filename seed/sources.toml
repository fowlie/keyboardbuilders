note     = "SUPPLIED BY THE AGENT 2026-09-02 under the owner's AFK authorisation, and this commit is the credential. ZMK states only the vendor page https://keeb.io/products/bfo-9000-keyboard-customizable-full-size-split-ortholinear, so `signal = none` was right about what ZMK says and wrong about what exists. Keebio publishes the PCB itself: `keebio/bfo9000-pcb`, public, MIT via LICENSE.txt, 25 files, and exactly one `bfo9000.kicad_pcb` at the repo root -- so no `path` is needed. Checked against the org rather than guessed: of Keebio's 47 public repos only three carry a PCB (`bfo9000-pcb`, `quefrency-rev1-pcb` which this corpus already imports, and `fourier`); every Iris repo is a CASE. That asymmetry is the finding, see ticket 21"

