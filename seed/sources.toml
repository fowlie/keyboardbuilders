[[entry]]
tree     = "qmk"
id       = "ibnuda/squiggle/rev1"
name     = "squiggle"
source   = "ibnuda/squiggle"
# 34 KEYS, THE LOW PROFILE BOARD'S -- applied 2026-09-26 on the owner's report that this
# design is drawn wrong, and accepted by the owner the same day. The QMK record
# is the whole squiggle FAMILY (LAYOUT 34, LAYOUT_split_3x5_3 36, LAYOUT_complicated and
# LAYOUT_thumbrow 38, LAYOUT_full 40), and the headline drew the 40-key LAYOUT_full. But
# this design is the one board it is attributed to, lopro/squiggle-lopro.kicad_pcb, a
# reversible one-hand file placing 17 switches (15 `choc-1`, 2 `choc-2`), and the
# README's "Low Profile" section says "34 Keys. 4x2u thumb keys." 17 x 2 = 34.
keys     = 34
path     = false
stated   = "https://github.com/ibnuda/squiggle"
signal   = "qmk-url"
verdict  = "confirmed"
note     = ""

# THE REST OF THE SQUIGGLE FAMILY, 2026-09-26, on the owner's ask ("maybe add the other
# squiggle variants then?"). The README names five: Standard, Low Profile, 36 Keys,
# Minimalist and Goldberg. Low Profile is the row above; Standard and 36 Keys need no
# row, because upstream's record fits their boards by count and the board-first pass mints them. These
# two cannot be minted that way.
#
# MINIMALIST: one Pro Micro for both halves, joined by the README's "Amphenol 10 wire"
# cable, so it is not the split rev1 record. Its record is the author's fork (see
# seed/trees.toml `squiggle-minimalist`), whose info.json is a 5-key template; the count
# is the README's "34 Keys" and squiggle_minimalist.h's LAYOUT, and the board places 34.
[[entry]]
tree     = "squiggle-minimalist"
id       = "squiggle_minimalist"
name     = "squiggle minimalist"
source   = "ibnuda/squiggle"
keys     = 34
path     = false
stated   = "https://github.com/ibnuda/squiggle"
signal   = "dev-seed"
verdict  = "confirmed"
note     = "the README's Minimalist section links https://github.com/ibnuda/qmk_firmware/tree/squiggle-minimalist/keyboards/squiggle_minimalist as its firmware"

# GOLDBERG: runs upstream's rev1 unchanged (the README's example firmware is QMK master's
# `rick-complicated` keymap, LAYOUT_complicated), but its one-hand board places 21
# footprints -- 15 finger keys, two 2u thumbs, and four 1u thumbs laid over them as
# alternates ("4x2u or 8x1u thumb keys. (or anything in between)") -- so no count of
# rev1's fits the footprint count, and a hardware row states the largest: 8x1u thumbs,
# 38 keys, the README's "34 - 38 Keys" upper end and LAYOUT_complicated's count. The
# 4x2u end, 34, is an `alternate` fill in seed/board-fills.toml, which adds the layout.
[[entry]]
tree     = "hardware"
id       = "squiggle-goldberg"
name     = "Squiggle Goldberg"
source   = "ibnuda/squiggle"
firmware = "qmk:ibnuda/squiggle/rev1"
keys     = 38
path     = false
stated   = "https://github.com/ibnuda/squiggle"
signal   = "dev-seed"
verdict  = "confirmed"
note     = "README Goldberg section: '34 - 38 Keys', '4x2u or 8x1u thumb keys', example firmware QMK master keyboards/squiggle/keymaps/rick-complicated"

