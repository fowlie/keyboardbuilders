# -- tree = "cheapino-vial" -----------------------------------------------------
# A design whose FIRMWARE RECORD IS NOT UPSTREAM. Backlog #64, and the first row of
# its kind.
#
# `tree` is a key into `seed/trees.toml`, so this row enters the universe by the
# same door every other row uses -- the drafter, the gate and the readers all treat
# it as the QMK record it is, read from `tompi/vial-qmk@cheapinov2` instead of from
# `qmk/qmk_firmware@master`. What the page publishes is `family = "qmk"`, because a
# fork of QMK still runs QMK; what is DIFFERENT is that `qmk compile -kb cheapino`
# does not work until you clone the author's tree, which is the fact
# `FirmwareRef.url` carries and the design page states.
#
# `signal = "dev-seed"` is the honest signal, and this file's header already defines
# it: a human supplied it and this commit is the credential. Nothing else could have
# -- the source drafter reads a record's own `url` field to find its hardware repo,
# and `keyboards/cheapino/info.json` declares `url = ""`. There was nothing to read.
#
# Checked before it was written, not asserted: the repo is CC-BY-4.0, not a fork,
# 1169 stars, and holds exactly one board -- `pcb/cheapino.kicad_pcb` -- beside two
# plate files the plate filter excludes by footprint library.
[[entry]]
tree     = "cheapino-vial"
id       = "cheapino"
name     = "Cheapino"
source   = "tompi/cheapino"
# RULED 2026-09-07, the owner: *"it's not 37 keys. it's 36 + 1 encoder."* The record
# declares one 37-position `LAYOUT_split_3x5_3`, and the 37th is the encoder's push --
# a QMK LAYOUT is a matrix map, not a physical description (Forgejo #23). The author
# agrees: the repo describes itself as "An affordable split 36 keys keyboard".
#
# STATED HERE RATHER THAN DERIVED, and backlog #65 is why. The machine that should have
# caught it, `without_encoder_positions`, tests `(switches + encoders) x halves` and so
# assumes an encoder per hand; this board is reversible, placing 18 switches and one
# encoder, with only one half's encoder in the matrix map. Widening the rule to
# `switches x halves + encoders` was measured over all 573 confirmed rows and corrects
# two designs -- this one, and `keyzog/kapl`, whose own README says "a split ergonomic
# keyboard with 70 keys (7x5)" twice. The arithmetic cannot tell them apart.
#
# The board is the falsifier and it corroborates: 18 placed, and 18 x 2 = 36.
keys     = 36
path     = false
stated   = ""
signal   = "dev-seed"
verdict  = "confirmed"
note     = "Thomas Haukland, Oslo. The record is the author's own and unmerged: `tompi/vial-qmk@cheapinov2/keyboards/cheapino`, declaring 37 keys on `LAYOUT_split_3x5_3` and an RP2040. Backlog #64's acceptance case."

