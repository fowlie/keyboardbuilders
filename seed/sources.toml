# 58 KEYS, NOT 60 -- the owner's standing rule from KLOR (#23) and the Cheapino (#65), that
# an encoder's push is not a key, applied 2026-09-26 on his Forgejo #49 report ("it is an
# ENCODER"). Not a fresh ruling of his on this board; he can overrule it. `LAYOUT_split4x6_r1`
# holds 60 positions, and two of them -- `Mute` [4,5] and `XXX` [9,5] -- are the pushes of
# the two `EC11_Rotary_Encoder` footprints beside the thumbs (SW30, SW60), which place no
# switch. The board places 58 switch positions: 56 `SW_MX_HS_1u` and 2
# `SW_MX_Hotswap_Rotary_Switch` in the outer bottom corners, each "option to use an EC11
# rotary encoder instead". The README: "58 is needed with 2 rotary encoders ... 4 encoders
# 56". 58 is the most keys a Junco can have. `without_encoder_positions` cannot derive it:
# this one file holds BOTH hands, so its `switches x 2` arithmetic reads 116.
