[[entry]]
tree     = "qmk"
id       = "dcpedit/redherring"
name     = "Red Herring"
source   = "dcpedit/redherring"
# RULED 2026-09-25, the owner, on the Cheapino's precedent: 89 keys, not 90. The
# record's one `LAYOUT` holds 90 positions and matrix `[0, 14]` is the encoder's push --
# every other position is a switch footprint `MX<row><col>` on the board, and that one
# is not. `without_encoder_positions` misses it because the board carries 98 switch
# footprints for its alternates (ISO/ANSI, split backspace, three shift and space
# options), so no arithmetic on footprint counts lands on 89.
#
# The falsifier is `measure_keycaps.most_keys`: the most caps each of the three board
# files holds at once without two overlapping is 89 on all three.
keys     = 89
path     = false
stated   = "https://github.com/dcpedit/redherring"
