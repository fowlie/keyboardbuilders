verdict = "confirmed"
signal  = "human"
note    = "2026-09-29. jyap808/pando, firmware/keyboards/jyap808/pando: rules.mk sets CUSTOM_MATRIX = lite, because the right half is scanned through a PCA9555 over I2C. config.h declares MATRIX_ROWS 5 and MATRIX_COLS 12 -- six columns a side (MATRIX_COLS_PER_SIDE), the left on STM32 GPIOs, the right on the expander's PORT0, mirrored into matrix cols 6-11. matrix_scan_custom() drives each ROW low (gpio_write_pin_low(left_rows[r]) on the left, ~right_rows[r] on PORT1 of the expander) and reads every COLUMN, which idles high (gpio_set_pin_input_high), a LOW column being pressed. Rows driven, columns sensed is QMK's COL2ROW, and keyboard.json declares \"diode_direction\": \"COL2ROW\" in agreement."
