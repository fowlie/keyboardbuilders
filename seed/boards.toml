[[entry]]
tree     = "qmk"
id       = "atreyu/rev1"
source   = "climent/atreyu"
boards   = ["pcb/v1/atreyu-pcb2.kicad_pcb", "pcb/v2/atreyu-pcb2.kicad_pcb"]
name     = "atreyu"
verdict  = "confirmed"
signal   = "human"
note     = "owner-ruled 2026-09-06, re-cut along the layout. v1 and v2 are BYTE-IDENTICAL in switch positions -- every one of the 60 coordinates matches -- so they are one design's revisions, and publishing them as two rows published one keyboard twice. v0.1 is a DIFFERENT keyboard and was dropped: 58 switches, columns at 13.6 degrees against v1's 18, thumbs at 46.4 against v1's 4/32/42. It rode on this record because no QMK record describes a 58-key Atreyu -- rev1 and rev2 declare identical 60-key layouts and differ only in matrix pins, encoder pins and USB device version -- so it leaves the corpus rather than sit under a row declaring 60. Measured over the 14 rows holding two or more whole-keyboard boards, this was the only one whose boards disagreed: 0.46u of drift where the next-widest is 0.18 and ten of the fourteen are 0.00."

[[entry]]
tree     = "qmk"
id       = "atreyu/rev2"
source   = "climent/atreyu"
boards   = ["pcb/v2-choc/v2-choc.kicad_pcb"]
name     = "atreyu v2 choc"
verdict  = "confirmed"
signal   = "human"
note     = "owner-ruled 2026-09-06. The Choc board was already publishing -- Half B minted it from the one board nothing had claimed -- but under the name its PATH gave it, `v2 choc`, which reads on the site as a keyboard called that and says nothing about the Atreyu. Ticket 44's naming rule anticipates exactly this: the directory is normalised by the human confirming the row. rev2 is the right record for it by the repo's own README -- \"There are 3 different revisions: handwired, rev1 and rev2, depending of the board you are building\" -- and rev2 is free to describe it because rev1 holds the MX pair. It stays a SEPARATE ROW from `atreyu`: same 60-key layout, but Choc against MX is a switch-footprint difference and a different pitch, which are facets the site filters on."

