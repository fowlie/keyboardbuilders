[[entry]]
tree     = "zmk"
id       = "jorne"
source   = "joric/jorne"
boards   = ["corne-cherry/pcb_v3/corne-cherry.kicad_pcb"]
name     = "Jorne Cherry 3.0"
verdict  = "confirmed"
signal   = "human"
note     = "CORRECTED 2026-09-11: the repo's default branch is `jorne`, not `master` -- reading `master`'s README first read as generic 'Corne keyboard' and cost this note a wrong premise. The `jorne` branch's own README is headed '# Jorne keyboard' and names three PCB revisions: Jorne Classic 2.1, Jorne Cherry 2.1, Jorne Cherry 3.0 -- this repo IS Jorne-specific, not a bare Corne mirror. No file is literally named 'jorne', but ZMK's own devicetree defines a real, distinct 44-key layout for the shield (joric_jorne_full_layout, 'Full (with pinky)', one column more than standard 42-key Corne). This is Cherry 3.0: 'non-reversible PCB with kailh hotswap sockets and south facing switches' per the README, 44 switches in one file, no hand-mirroring needed. See seed/names.toml for Classic 2.1 and qmk:jorne/rev1 for Cherry 2.1 -- three distinct designs, one repo. corne-chocolate (21/hand=42) and corne-light (42 in one file) are the ones that really are plain, unmodified Corne (foostan/crkbd), correctly excluded by build_seed.py's is_ancestors_board. Verified 2026-09-10/11 during #89."

