note     = "agent 2026-08-29, ruled on evidence rather than inference. The repo ships two board files and the grouper sees two designs. `pcb/keyboard_pcb-rounded.kicad_pcb` is MD5-identical to `diepala/cantor`'s `Cantor_Classic/keyboard_pcb-rounded.kicad_pcb` (44bc339a75dbfbe1853ecbe06379b83a) -- an inherited copy the fork never touched, still placing 21 switches a hand, i.e. Cantor's 42. Only `pcb/keyboard_pcb.kicad_pcb` was edited, to 18 a hand, which is the 36-key Remix. Taking both would union 36 and 42 and publish a keyboard that does not exist. The rounded file is a leftover of the fork, not a variant of this design."

