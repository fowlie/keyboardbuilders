# ADDED 2026-09-10, owner-raised ("we should add a rp2040_zero"). It closes the one
# footprint this catalogue modelled and had no row for -- backlog #59 named
# `ControllerFootprint.Rp2040Zero` as "exactly this today" -- and **10 corpus designs
# socket it**: bad-wings-bold, cheapino, chouchou, sha-choc, sha-mx, silakka54, the three
# stronts (QMK) and lily58-lite-rev3 (ZMK). Until now every one of them was told "we don't
# have any of those catalogued yet".
#
# NO `zmk`, AND THAT IS THE CAREFUL PART. §3.4's asymmetry: "QMK's board-level support is
# broader than its enum; ZMK's is not broader than its list", because Zephyr needs a board
# definition to build at all. ZMK's `app/boards` has no `waveshare` vendor directory
# (checked 2026-09-10 against both the GitHub API and the local checkout), so there is no
# ZMK board definition for this module and claiming `zmk` would assert a build that cannot
# happen. `qmk` is sourced at the chip level, which §3.4 established is the right gate --
# RP2040 is listed outright in `compatible_microcontrollers`. `kmk` likewise: KMK's own
# supported-microcontrollers page carries a bare "## RP2040" section, and its stated
# minimum is a capability ("CircuitPython, 256KB of flash storage"), which this board's
# 2 MB clears.
#
# LEAVES ONE HONEST ODDITY VISIBLE rather than papering over it: `lily58-lite-rev3` ships
# a ZMK shield and sockets this footprint, so its Door B page now reads "none of the 1
# we've catalogued run ZMK" instead of "nothing catalogued". Both are true; the second says
# more. Whether a stock RP2040-Zero can run that shield at all is a question for the
# corpus, not for this row.
[[entry]]
name      = "RP2040-Zero"
slug      = "rp2040-zero"
footprint = "rp2040_zero"
usb       = ["usb_c"]
wireless  = false
mcu_family = "rp2040"
firmware  = ["qmk", "kmk"]
url       = "https://www.waveshare.com/wiki/RP2040-Zero"

