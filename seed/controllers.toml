# seed/controllers.toml -- the controller board catalogue Door B's CONTROLLER section
# checks a socketed design's footprint against (ticket 16 decision 4; ticket 5/14 decided
# this file's home), and the source for `/parts/dev-board/:slug` (ux.md's own answer to
# "a bare list of 20 board names teaches a newcomer nothing" -- §9 build order item 6,
# "cheap, high SEO leverage"). The reasoning and every primary source live in
# docs/research/controller-catalogue.md -- this file only carries the rows the build
# actually consumes, same split `seed/licences.toml`'s header describes for its own
# reasoning-vs-data documents.
#
# `slug` IS EXPLICIT DATA, not derived at runtime -- same discipline `Slug` follows for
# designs (ticket 07 decision 8): a URL is a promise, so what it is is a fact this file
# states, not something a slugify function might one day compute differently.
#
# `url` is the research doc's own primary-source citation, and it is ABSENT rather than
# guessed where the doc cites no single clean link (`Stemcell`, `Michi`, `Imera`,
# `Svlinky`, `Bonsai C4`, `Bonsai C3`, `Bluepill` -- all sourced there only as
# "development_board enum + converters", not a page to send a reader to).
#
# SIX FIELDS -- five until 2026-09-10, when `mcu_family` was added; see below. GPIO
# count, ADC channels and logic voltage stay out for the same reason they always have
# here: ticket 5's headline finding is that the compatibility graph
# needs none of them, and the doc's own §6 "Gaps" table marks most of that data as not
# sourced for most boards -- a spec table built from it would be mostly blank, not a
# comparison aid. `firmware` is not optional: footprint alone is not compatibility
# (backlog #58's own history -- a QMK-only design was shown a ZMK-only board as fitting
# because both share `pro_micro`).
#
# `mcu_family` IS THE ONE FACT DOOR B'S REVERSE DIRECTION NEEDS, added 2026-09-10 on the
# owner's ruling that `/parts/dev-board/:slug` should list designs sharing the footprint
# as well as the 1:1 fits, minus what a firmware demonstrably cannot run. `firmware`
# above cannot make that call: it is a POSITIVE list ("this board is known to run these"),
# so its silence is Unknown and never Impossible. The two rules that ARE impossibility --
# `nRF52 => not QMK` and `AVR 8-bit => not ZMK` -- are stated by QMK's and ZMK's own docs
# at MCU-FAMILY level (docs/research/controller-catalogue.md §3.4), so a family is exactly
# what they need and a part number would be false precision. `ControllerFit.kt` holds the
# rules and cites both sources.
#
# Values: `nrf52` `rp2040` `stm32` `samd21` `avr8` `unknown`. Matching `McuFamily` plus
# an explicit `unknown` -- NOT an omitted key, so that a typo'd field name is a build
# error rather than a board quietly losing its rule-outs.
#
# `unknown` is stated for FIVE boards -- michi, imera, svlinky, bonsai-c4, bonsai-c3 --
# and this is the honest read rather than a gap to fill in. §4.3's table groups them under
# a heading reading "Pro Micro / Elite-C footprint, RP2040", but that heading is NOT a
# per-row assertion: `Stemcell` sits in the same table annotated STM32F411, which is what
# a heading-as-fact reading would have got wrong. The doc sources all five only as
# "development_board enum + converters" and names no chip for any of them. Resolving them
# needs a fetch of each vendor's own repo, which is a research pass and not a guess --
# and until then no rule fires on them, which is the correct outcome for a chip nobody
# has read.
#
# `footprint` is one of the seven `ControllerFootprint` values `Design.kt` already has --
# NOT the research doc's own footprint names, several of which this build does not
# model (see EXCLUDED below). Elite-C-footprint boards are filed under `pro_micro`,
# matching ticket 27's own reading: "Elite-C, nice!nano, Sea-Picro, Frood and Proton C
# all fit that footprint" -- the two footprints are pin-compatible for every pin this
# catalogue tracks, and the model has never carried a separate Elite-C variant.
#
# CORRECTED 2026-09-04, owner-raised, from QMK's own two documentation pages. The three
# RP2040 boards here -- Raspberry Pi Pico, Seeed XIAO RP2040, Adafruit QT Py RP2040 --
# carried `firmware = ["zmk"]`, taken from the research doc's per-board table, which read
# QMK support off the `development_board` enum and its converters. THAT IS THE WRONG
# QUESTION. `docs.qmk.fm/compatible_microcontrollers` lists RP2040 as a supported
# microcontroller outright ("any USB-capable AVR or ARM microcontroller with enough flash
# space"), and `docs.qmk.fm/platformdev_rp2040` documents `BOARD = GENERIC_RP_RP2040`
# precisely for boards that "do not wish to leverage the configuration matching the Generic
# Pro Micro RP2040 board" and declare their own pins. A converter is a pin-NAMING
# convenience; it is not the gate on whether QMK runs.
#
# The consequence was 16 live pages -- 8 socketing `rpi_pico` including `piantor`, `junco`
# and `sofle-pico`, 8 socketing `seeed_xiao` -- each telling a QMK-only design that none of
# the catalogued boards run its firmware. Those are QMK keyboards on a Pico.
#
# `Seeeduino XIAO` is deliberately NOT corrected alongside them, and it is the control that
# makes this chip-driven rather than a blanket edit: it is SAMD21, which appears nowhere in
# QMK's supported list. It stays ZMK-only.
#
# ZMK needed no correction in the same pass. `zmk.dev/docs/hardware` says ZMK supports
# "not limited to Nordic nRF52, Raspberry Pi RP2040/RP2350, most ST STM32 MCUs, and
# Microchip SAMD21" -- broader than nRF52 -- but Zephyr requires a board definition, so
# ZMK's supported-hardware list IS the set of boards, and every board on it that this
# catalogue models already carries `zmk`. `Bluepill (STM32F103)` is absent from that list
# and stays QMK-only for exactly that reason.
#
# `usb` ADDED 2026-09-25, backlog #97: the receptacle ON THE BOARD, so a design page can say
# which cable reaches the computer. Every value is sourced in
# the owner's notes with a quote from the vendor, the board's own
# repo or its datasheet. TWO values mean the board is sold both ways, and the builder picks:
# nRFMicro rev 1.1 places both footprints, and the classic Pro Micro has USB-C versions from
# SparkFun (DEV-15795) and Keebio. OMITTED means no primary source says so (`rp2040-ce` is a
# pinout standard rather than a board; `imera`'s page is gone; `bluepill` has no vendor to
# cite), which is Unknown and never a guess from "boards like this usually have".
#
# EXCLUDED, deliberately, rather than forced into the nearest slot:
#   - Makerdiary nRF52840 M.2 -- an M.2 edge connector, not a pin-header footprint at
#     all, and `ControllerFootprint` has no member for it (same gap backlog #39 found
#     for MicroMod, ItsyBitsy, Feather and Teensy 2.0 on the DESIGN side). Feather got
#     its member on 2026-09-25 (#99) and has a row below.
#   - ~~Every RP2040-Zero-footprint board~~ **NO LONGER EXCLUDED, 2026-09-10.** This
#     bullet said "nothing here is invented to fill that member" and that stayed true
#     while the research doc covered no such board. `RP2040-Zero` is now a row, sourced
#     from Waveshare's own wiki rather than from that doc -- which is a widening of where
#     this file may take a citation, not a licence to guess. The 10 designs socketing the
#     footprint were being told "nothing catalogued"; see the row's own comment for why it
#     carries `qmk` and `kmk` but deliberately not `zmk`.
#   - Frood RP2040, Puchi-C, Supermini nRF52840, Bit-C (non-PRO) -- the doc's own §6
#     "Gaps" table: no primary source, listed there rather than silently dropped.

# ADDED 2026-09-25, backlog #97. The board the `pro_micro` footprint is NAMED for, and the
# commonest one in it, was missing from this catalogue: the research doc tabled its
# replacements and never the original. It matters most for the cable question: every
# other `pro_micro` board here is USB-C, so without this row a design page would tell a
# reader "USB-C on every catalogued board" while the board most builders buy is micro-USB.
# SparkFun's own page for DEV-12640, verbatim: "On-Board micro-USB connector for
# programming". SparkFun's DEV-15795 and Keebio's "Pro Micro (USB-C Version)" are the
# same ATmega32U4 board with USB-C, hence both values. `qmk` only: ZMK excludes `avr8`
# (`seed/firmwares.toml`), and no KMK source names it.
[[entry]]
name      = "Pro Micro (ATmega32U4)"
slug      = "pro-micro"
footprint = "pro_micro"
usb       = ["micro_b", "usb_c"]
wireless  = false
mcu_family = "avr8"
firmware  = ["qmk"]
url       = "https://www.sparkfun.com/products/12640"

