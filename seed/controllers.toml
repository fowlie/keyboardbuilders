# Backlog #99, 2026-09-25. The one Feather this file carries, because it is the one a
# firmware's own docs name. QMK's docs/features/wireless.md, verbatim: "The Feather 32u4
# Bluefruit LE is supported as it's an AVR mcu connected via SPI to the Nordic BLE chip
# with Adafruit firmware." So `avr8`, not `nrf52`: the chip QMK runs on is the 32u4, and
# the nRF51822 beside it is the radio. `wireless = true` is that radio.
#
# Three published PCBs place a Feather footprint (`prkl30`, `dropin-v1`, `fruity60`),
# and `fruity60`'s own QMK record declares `bluetooth: {driver: bluefruit_le}` on an
# `atmega32u4` at 8 MHz, the Feather 32u4's clock.
#
# NO FEATHER nRF52840, and not for lack of the board. No ZMK or KMK source read so far
# names it, and a row with no firmware source is a guess.
