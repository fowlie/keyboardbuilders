# seed/parts.toml -- the parts module's curated layer (#112): shops, the parts and kits
# they sell, and which listing on which shelf is which part. Prices and stock are NOT
# here: those are dated observations in the database (`offer_observation`, V7), written by
# `scripts/observe_42keebs.py`. This file changes when a person reads a listing again.
#
# `scripts/build_parts.py` checks it and writes `src/main/resources/seed/parts.json`.
#
# EVERY 42KEEBS ROW BELOW WAS READ OFF THE SHOP'S OWN STORE API on 2026-10-04
# (`/wp-json/wc/store/v1/products`, both pages, and the variation ids one at a time): the
# ref, the URL (`permalink`), the pack ("Price per 10 sockets", "Price per 10 diodes") and
# the kit's contents, in the vendor's words. No API field states a pack size, so a person
# reads it off the description, and reads it again when the listing changes.
#
# Tokens are the design seed's own where one exists (`mx_socket`, `pro_micro`), so a part
# and a design cannot spell the same interface two ways. Diode packages: `do_35`
# `sod_123` `sod_123f` `sod_323` `sod_523`. Switch kinds: `linear` `tactile` `silent_linear`
# `silent_tactile` `clicky`. SOD-123F is not SOD-123 until the owner rules
# that it fits SOD-123 pads; until then the build list shows it as "not ruled a fit".

[[shop]]
slug = "42keebs"
name = "42. Keebs"
currency = "EUR"
# The Store API's prices are net: the product page charged 25% on top when loaded from
# Norway (15448: API 2800, page JSON-LD 35.00 "valueAddedTaxIncluded"; 4808: 2070 and
# 25.88), while the shop's own country, CZ, charges 21%. So the page adds the visitor's
# VAT, and the build list does the same with the rate below. 2026-10-04.
prices_include_vat = false
vat = { NO = 25 }

# -- parts --------------------------------------------------------------------------
# The MPNs are Kailh's for the one socket of each kind; 42keebs names only the switch
# series (PG1511, PG1350). LCSC C5333465 is CPG135001S30.

[[part]]
slug = "kailh-mx-hotswap-socket"
name = "Kailh MX hotswap socket"
fits = { switch_socket = ["mx_socket"] }
mpn = "CPG151101S11"

[[part]]
slug = "kailh-choc-hotswap-socket"
name = "Kailh Choc V1 hotswap socket"
