# footprint name was found in the board file. A design with no row is Unknown, never
# "no diodes".

[[diode_package]]
design = "lily58-pro"
package = "sod_123"
source = "board-scan.json: Lily58-footprint:Diode_SOD123 x29 in kata0510/lily58 Pro/PCB/Lily58_Pro.kicad_pcb (reversible, one PCB per half)"

# -- kits ---------------------------------------------------------------------------
# A kit's facts are the vendor's, dated `read_on`. `contents` is shown, never priced.
# `needs` is what the vendor says the builder must still buy, priced like any line.
# `not_priced` is the rest of the vendor's "not included" list, in its words.

[[kit]]
slug = "42keebs-lily58-pro"
name = "Lily58 Pro Hotswap Split Ergo 50% Kit"
shop = "42keebs"
url = "https://42keebs.eu/shop/kits/pro-micro-based/lily58-pro-hotswap-split-ergo-50-kit/"
based_on = "lily58-pro"
read_on = 2026-10-04
contents = [
    { quantity = 2, text = "main PCBs", kind = "pcb" },
    { quantity = 2, text = "bottom plates made from PCB material (FR4)" },
    { quantity = 2, text = "FR4 switch plates" },
    { quantity = 60, text = "SMD diodes", kind = "diodes" },
    { quantity = 2, text = "TRRS sockets" },
    { quantity = 2, text = "reset/boot switches" },
    { quantity = 2, text = "SMD power switch" },
    { quantity = 58, text = "MX or Choc hotswap sockets", kind = "switch_sockets" },
    { text = "Brass standoffs and screws" },
    { quantity = 2, text = "acrylic covers" },
]
# "2x nice!nano (for wireless) or Frood (wired) controllers": both drop into a Pro Micro
# socket, so the need is the footprint and either board answers it.
#
# "58x Cherry MX-compatible switches" is on the vendor's "not included" list, so the kit
# does not include switches and the builder buys them. MX or Choc V1, not MX alone: the
# kit's own variations are "Cherry MX-compatible" and "Kailh Choc V1" (6241-6244).
needs = [
    { fits = { controller_socket = ["pro_micro"] }, quantity = 2 },
    { fits = { switch = ["mx", "choc_v1"] }, quantity = 58 },
]
not_priced = ["TRRS cable (for a wired build)"]
