dev_board = "nice-nano-v2"

[[part]]
slug = "pro-micro"
dev_board = "pro-micro"

# Switches (#115), the whole "Switches" category of 42keebs' Store API as read 2026-10-05,
# less what is not a switch (lube, brushes, openers, a stem holder). Each colour or
# variation is its own part, since it is a different switch; Kailh Choc's 9010 and the
# Ambients' 26591 are variable products, so their listings are the variation ids.
#
# `fits` is the switch footprint in the design seed's tokens (`mx`, `choc_v1`, ...): the
# Gateron, JWICK and KTT listings are MX-style ("PCB mount (5-pin)", KTT "Plate mount
# (3-pin)"); 9010 says "Only compatible with PCBs designed for Kailh Choc V1", the Ambients
# "will work on any keyboard that is Choc V1 compatible", and the Sunset is model
# CPG135001D02-3, Kailh's Choc V1 series. 5-pin against 3-pin is not modelled yet.
#
# `switch_kind` is the vendor's own word, from its "Linear"/"Tactile" category, the name
# or the variation ("Nocturnal (20 g linear)"), and "silent" only where the vendor says
# so (the Ambients). A switch the vendor does not type leaves it out: Unknown, not linear.
#
# `[part.spec]` is what the listing's description states, read 2026-10-05, and only that:
# a field the listing leaves out is left out (not recorded, never "no"). Forces are gf
# (42keebs writes "gf (cN)" and "cN (gf)" for the same number), travel in mm. A force the
# vendor gives without saying which one (Kailh Choc's "Pink: linear, 20 gf", the Ambients'
# "20 g linear") is not filed as actuation; it stays in `vendor_says`, word for word. The
# Gateron Brown's "~65 cN" bottom-out is an estimate and is left out. The Ambients Sunrise
# has no spec: its variation says 40 g, its description 35 g, and it is not out yet.
# `factory_lubed` is the listing's own "Pre-lubed" attribute, or the description saying so
# (the Sunset); the Kailh Choc 9010 variations and the Ambients say neither.

[[part]]
slug = "gateron-yellow-milky"
name = "Gateron Yellow Black/Milky"
fits = { switch = ["mx"] }
switch_kind = "linear"
# 42keebs listing 26360.
[part.spec]
per = "42keebs"
read_on = 2026-10-05
actuation_force_gf = 50
bottom_out_force_gf = 60
actuation_mm = 2
travel_mm = 4
factory_lubed = false
pins = 5
housing = "Nylon top and bottom housing"
stem = "POM stem"
vendor_says = "Great value classic linear switch"

