# pierrechevalier83/ferris, 2026-09-28: split, and only the wrong record said so.

[[entry]]
slug    = "base-ferris"
name    = "base ferris"
halves  = 2
reversible = false
verdict = "confirmed"
signal  = "human"
note    = "2026-09-28. QMK's own keyboards/ferris/readme.md: \"A split 34 keys column staggered keyboard\". Ferris 0.1 (ATmega32U4) and 0.2 (STM32F072) both scan the far half through an MCP23017 over I2C (keyboards/ferris/0_1/matrix.c and 0_2/matrix.c, CUSTOM_MATRIX), so their records set no split flag -- the 3w6 mechanism. It had published as split only because `ferris/sweep` also attached here, and that is the Pro Micro Sweep, which `agreeing_with_board` now keeps off a board with its own chip. NOT REVERSIBLE, the owner's ruling 2026-10-01 and the board's own layout: in the design's .kicad_pcb the left half places the chip and the USB-C receptacle, the right half the MCP23017 IO expander, 17 switches each, so the two halves are two different PCBs."

