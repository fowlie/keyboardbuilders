note    = "2026-10-02, owner-prompted by a build photo (r/ErgoMechKeyboards r7hrhr) showing one nice!nano face up and the other face down. The board file says the same: `Architeuthis dux/architeuthis_dux.kicad_pcb` is ONE HAND, 17 key positions (the design's 34 is 17 x 2), and the folder holds no other board, so one PCB makes both halves. Each position carries Kailh socket pads on BOTH copper faces (34 smd pads on F.Cu, 34 on B.Cu) plus a plated solder footprint; the Pro Micro footprint is a plain 24-hole one, which serves the flipped half with the controller mounted face-down; the TRRS footprint is `TRRS-PJ-320A-dual`."
