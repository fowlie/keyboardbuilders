note    = "the author's README calls it \"one of the cheapest split keyboards you can build\" and then states the exact mechanism this file exists for: \"The pcb is reversible, connected using rj45, and utilizes a japanese duplex matrix, so only one mcu is needed.\" One MCU over a duplex matrix is one matrix to QMK, so `split.enabled` is unset and we published `unibody`. The board corroborates it -- `pcb/cheapino.kicad_pcb` places 18 of the design's 36 switches and two `Connector_RJ:RJ45_Ninigi_GE`. Backlog #64's acceptance case, and the first ruling on a design whose firmware record is not upstream. NOT RECORDED, and the README states both: the PCB is REVERSIBLE (this file carries only `halves`, and `reversible` publishes Unknown for 103 of 106 splits) and the link is RJ45 (outside ticket 52's lexicon, which reads jacks -- so `link` reads `no_wired_link`, the same honest silence the 3w6 gets for its USB-C, and the same case backlog #63 is about)"

