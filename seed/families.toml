# seed/families.toml -- which keyboard each design is one PCB of. Backlog #107.
#
# The owner asked "why do we have so many sweep boards?" on 2026-09-30. The answer was six
# real, separate PCBs from one repo, which the site showed as six unrelated keyboards
# because nothing said they belong together. A family names them as one keyboard.
#
# A FAMILY IS A NAME OF ITS OWN, not one of its members. "Corne" is the family, and Corne
# Cherry v4 and Corne Chocolate v4 are its variants; no design is called just "Corne".
#
# THE RULE THAT DRAFTS THESE (owner, 2026-09-30 to 10-01): same GitHub account + one name
# starts with the other + at least one key count both boards can be built to, snap-offs
# included + the same body kind. It changes ticket 07's decision 4 ("never inferred from
# name stems"). The draft is in the owner's notes. A row here
# is a person's ruling on it, and is also where a report that two boards are, or aren't,
# one keyboard gets settled.
#
# KEYED BY PUBLISHED SLUG. `build_seed.py` refuses a member that does not publish and a
# design claimed by two families, so a rename that strands a row fails the build rather
# than quietly dropping a board from its family.
#
# `verdict` follows every other seed file: only `confirmed` rows are read.

# Sweep, 2026-10-01. The repo README's "What are the different types?" list names the
# family: Sweep 2, Sweep Half Swept, Sweep Bling MX, Sweep Bling LP, Sweep High, Sweep High
# M, Sweep Mini. Sweep Mini is not in the corpus: the board scan does not read its Choc
# Mini footprint as a switch. Cradio is NOT here -- the owner ruled it a different
# keyboard (2026-10-01), even though ZMK's `cradio` shield names it "Cradio/Sweep".
[[family]]
name    = "Sweep"
source  = "https://github.com/davidphilipbarr/Sweep#what-are-the-different-types"
members = ["sweep-2", "sweep-half-swept", "sweep-bling-mx", "sweep-bling-lp", "sweep-high", "sweep-high-m"]
verdict = "confirmed"

# -- Drafted 2026-10-01 by the owner's rule: "take the first common word of the same author".
#    Same GitHub account, and a word their names share once words that describe a variant
#    rather than name a keyboard are set aside (choc, mx, cherry, low, profile, rev, pro,
#    lite, split, hotswap, rgb, ...). The family takes that word, capitalized.
#
#    The owner's earlier rulings win over the rule:
#    - Reviung34 and Reviung34 split are two keyboards (2026-09-30): no row.
#    - Dilemma is two keyboards by size, as bastardkb.com sells them: Dilemma below, and
#      Dilemma MAX, which has one board in the corpus until MAX V3 is added (#107), so no
#      row yet.
#
#    Held back for the owner, because the shared word is a product line rather than one
#    keyboard: Env (envious-data: KB65, KB60, a macropad, RGB), Anavi (anavitechnology:
#    Arrows and two macro pads), GH80 (evyd13: the 1800 and the 3700 are different layouts).

[[family]]
name    = "Atom47"
source  = "https://github.com/evyd13"
members = ["atom47-rev5", "atom47-rev5-c"]
verdict = "confirmed"

