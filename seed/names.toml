# zzeneg's two repos, both drafted from a board path that names a SWITCH TYPE or a file
# rather than a keyboard -- map.md's fog lists "three designs named `choc`, `mx` and
# `full`" as one defect and this is it. Raised by the owner 2026-09-07.

[[entry]]
drafted  = "mx"
name     = "Stront MX-38"
source   = "https://github.com/zzeneg/stront"
verdict  = "confirmed"
note     = "The README is headed \"stront\" -- \"Family of modular split keyboards with 38 or 40 keys, LCD display and Cirque/Azoteq trackpad\" -- and names its three PCB variants MX-40 (40 keys), MX-38 (38 keys) and Choc (38 keys). This design is the 38-key MX board, `pcb/mx/pcb.kicad_pcb`. Capitalised `Stront` as a proper noun; the README's own headline is lower-case. Read from the repo 2026-09-07."

[[entry]]
drafted  = "choc"
name     = "Stront Choc"
source   = "https://github.com/zzeneg/stront"
verdict  = "confirmed"
note     = "The author's own name for the variant, from the same README. 38 keys, Choc v1, `pcb/choc/pcb.kicad_pcb`. The README notes it alone has no VIK or module support, so it is a genuinely different keyboard from the MX boards rather than a switch option on one -- which is what makes these separate designs rather than one with a switch set."

