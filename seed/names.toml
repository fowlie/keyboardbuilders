source   = "https://github.com/zzeneg/pica40"
verdict  = "confirmed"
note     = "A different repo by the same author, drafted from `pcb/full.kicad_pcb`. `full` is the FILE's name and the repo holds no other switch-placing board, so the design simply IS the Pica40. Named without a version: our record cites both `pica40/rev1` and `pica40/rev2`, so \"Pica40 v2\" -- the README's headline -- would narrow it falsely."

# foostan/crkbd's two boards, 2026-09-28. Drafted from `pcbs/corne-cherry/hotswap/` and
# `pcbs/corne-chocolate/hotswap/`, lower-cased. VERSIONED, the owner's call 2026-09-28:
# v3 -> v4 changed the controller from a Pro Micro socket to a soldered RP2040, and with
# it the firmware and the wiring, so an unversioned "Corne Cherry" would claim v4's facts
# for every Corne Cherry there is. The slugs change, and seed/renames.toml 301s the old
# ones. A later v3 row would publish as `corne-cherry-v3` beside these, not over them.

[[entry]]
drafted  = "corne-cherry"
name     = "Corne Cherry v4"
source   = "https://github.com/foostan/crkbd"
verdict  = "confirmed"
note     = "The README is headed \"# Corne keyboard\" and lists this board as `corne-cherry` under \"Latest versions\" (\"for Cherry MX compatible switches\"), with the build guide headed \"Corne Cherry v4\". Main holds only the v4 board: 2 RP2040s placed on it, and QMK's `crkbd/rev4_*` records. v1-v3 (Pro Micro) are \"Old versions\" whose boards are not on main. Named with the version, as the build guide is. Read 2026-09-28."

[[entry]]
drafted  = "corne-chocolate"
