# seed/names.toml -- what a design is actually CALLED, where the drafted name is wrong.
#
# The name of a design is drafted from its own board FILE PATH -- `Sweep half-swept/
# half-swept.kicad_pcb` becomes "half swept" -- because for the great majority of the
# corpus that is exactly what the author called it and the path is the only name a board
# file carries. Where it is wrong it is wrong in a way no rule can fix: the author's
# README says one thing and their directory says another, and only a person reading the
# README can tell which.
#
# `seed/boards.toml` already carries a `name` for this, and it only reaches HALF A --
# designs built from an attributed firmware record. A design built from a board that no
# record was attributed to (Half B) has no `(tree, id)` key to hang a name on, so it had
# no override at all until this file. That is the gap this closes, and it is why the key
# here is a slug rather than a record id.
#
# KEYED BY THE DRAFTED SLUG -- the slug the build DERIVES from the drafted name, not the
# one the site publishes after this file has had its say. Those differ for exactly the
# rows in here, which is the point: a key that changed when the override applied would
# stop matching on the next build and the name would flip back and forth.
#
# A RENAME IS A URL CHANGE, so it needs a row in `seed/renames.toml` too. Ticket 07
# decision 8: "slugs are mutable and old ones keep resolving. A machine-guessed name is a
# first draft too, so a rename leaves a redirect rather than a dead link." `build_seed.py`
# refuses a `renames.toml` row whose target does not publish, so the two files are checked
# against each other on every build.
#
# `verdict` follows every other seed file: `confirmed` rows are used, anything else is a
# proposal nobody has ruled on and is EXCLUDED from the build.

[[entry]]
drafted  = "half-swept"
name     = "Sweep Half Swept"
source   = "https://github.com/davidphilipbarr/Sweep/tree/main/Sweep%20half-swept"
verdict  = "confirmed"
note     = "The README's own headline is `# Sweep Half Swept`, and its first line reads \"Half of a Sweep2 with a reversible micro-controller footprint.\" The drafted name came from the board path and dropped the family, leaving a design called \"half swept\" that names no keyboard. Read from the repo 2026-09-07."

