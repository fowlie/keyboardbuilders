# NOT A CHOICE BETWEEN ALTERNATES -- the board places exactly these 17 footprints and
# nothing else (15 `choc-1`, 2 `choc-2`). What is ruled is only what the names cannot say:
#   * the widths. `choc-2`'s own outline on the board is a 36 x 17.3 mm keycap (fp_line
#     x -18..18, y -8.8..8.5, in the footprint's frame), so 2u along the footprint's x --
#     at SW13's 63.4 and SW17's 243.4 degrees, a 2u key tilted toward the centre, as the
#     repo's screenshots/squiggle-lopro.png render shows. The README's Low Profile
#     section says "4x2u thumb keys", and every QMK layout states these keys as 2u.
#     `choc-1`'s outline is 18 x 17 mm, 1u.
