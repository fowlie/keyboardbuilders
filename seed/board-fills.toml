# seed/board-fills.toml -- which of a layout-options PCB's alternate switch footprints make
# up the layout a design declares, where no machine reading can say.
#
# A PCB that offers a split space bar, a split shift and ISO/ANSI places every option;
# the keyboard you build fits one of them. `build_silhouettes.py` normally lets the
# firmware choose (`keycap_geometry`, backlog #81), but that needs footprint names that
# state their widths AND a firmware layout whose widths pick out one fill. Where neither
# holds, the board cannot be drawn without a person saying which footprints are fitted,
# and that is this file. Opened 2026-09-26 for `tg4x`.
#
# A ROW IS CHECKED AGAINST THE BOARD, NOT TRUSTED. `build_silhouettes.py` refuses the
# build unless every `key`:
#   * sits within 0.1 mm of exactly one switch footprint on `board`, as
#     `measure_keycaps.py --only SLUG --refresh` recorded it (`switches` in
#     keycap-scan.json);
#   * has the width its footprint's name states, or else says `name_says` (the width the
#     name states) and `why` the name is wrong -- a footprint name is evidence, and a
#     disagreement is written down rather than silently won;
#   * overlaps no other key (the same 1 mm-inset test `measure_keycaps.alternates` uses);
# and unless the row count equals `keys`, which must be a layout the design declares.
#
# `x`/`y` are the footprint's placement in the board's millimetres, copied from the
# scan; `w` (and `h`, default 1) are the keycap in key units. The rotation is the
# footprint's own. `source` says where the choice of footprints comes from.
#
# TWO OPTIONAL FIELDS, added 2026-09-26 for `squiggle-lopro`:
#   * `hand = "left"` (or "right") -- the board file holds ONE hand of a split, and the
#     row lists that hand's keys: half of `keys`. The drawing mirrors it with one key of
#     clear air between the hands, and the build refuses the row if the firmware's own
#     left-right arrangement fits the other hand better.
#   * `footprints = { "<name>" = { w = 2, why = "..." } }` -- a keycap width for a
#     footprint whose NAME STATES NONE (`footprints:choc-2`), with the evidence. Every
#     listed key on that footprint must then carry it. It cannot overrule a name that
#     does state a width; a key does that with `name_says`.
#
# A row here OUTRANKS every other way of drawing that design: it is tried first, so a
# later change to the position scan cannot silently stop it being used. The same fill is
# read by `measure_stagger.py` and `measure_splay.py` in place of that board file's
# merged positions, so stagger and splay are measured on the keys you actually fit.

# TG4x, 2026-09-26. Its record is the ZMK shield `tg4x` (45 keys), and TG4x.kicad_pcb is
# a layout-options board: 68 switch footprints for 44, 45 or 46 keys, so no count guard
# can draw it and a width match alone mirrors the split space bar. The fill below is the
# ZMK shield's own board, stated by:
#   * app/boards/shields/tg4x/README.md: "rev 2.1 of the board", "Split spacebar with
#     2.25U on the left and 2.75U on the right", "2U right shift";
#   * tg4x.overlay's matrix-transform: rows of 13 / 12 / 11 / 9, and every RC() in it is
#     a matrix position of upstream QMK's keyboards/tg4x LAYOUT (46 keys) except that it
#     leaves out RC(6,3), the 1u key beside a split right shift. QMK places the rest at
#     exactly these widths, including the 2.25u space at x 3.75 and the 2.75u at x 6.
# Two things the ZMK side does not state, taken from the board and the other firmware:
#   * Tab is 1.25u (Enter 1.75u), as upstream QMK and the author's own
#     qmk_firmware/keyboards/tg4x/rev21 layouts both state; ZMK is silent.
#   * The right shift is 2.25u, not the README's "2U": the only footprint that fills the
#     row's last 2.25 units is MX_PCB_225H at (237.83, 59.16), and the row must total 13u.
# RULED BY THE OWNER, 2026-09-26: the 2.25u right shift stands -- the README's "2U" is
# "probably a typo" -- and Tab at 1.25u stands with it. The author's own firmware also
# offers a different 45 (LAYOUT_TG3: 1u mods and a 6u space bar); this row draws the one
# the design's ZMK record describes.
