# squiggle lopro, 2026-09-26, on the owner's report that its thumbs were drawn straight and
# its halves touching. Its record is QMK `ibnuda/squiggle/rev1`, whose layouts state the
# thumbs as upright `h: 2` caps, so `board_may_draw` keeps the firmware (a 2u cap drawn 1u
