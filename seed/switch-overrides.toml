# seed/switch-overrides.toml -- switch facts the board scans got wrong, corrected by hand
# from the design's own README. Applied last by build_seed.py, the same shape as
# seed/splay-overrides.toml: a keyed correction, not a retuned rule that would move other
# designs nobody has looked at.
#
# Each row was found by #107 step 9's pad scan (2026-10-02,
# a measurement in the owner's notes) and checked against the README. Hillside
# 46/52's Mill-Max rows went once the pads were read per key position.
#
# `switches` replaces the design's switch list; `switch_mounts` replaces what its switch
# positions accept (solder, mx_socket, choc_socket, millmax). Either may be left out.

[[entry]]
slug     = "ergoslab"
switches = ["choc_v1", "mx"]
note     = "README: \"Kailh hotswap sockets for all the MX-style switches (choc are soldered in)\", 42 MX and 10 Choc. The MX footprint, `Kailh_socket_reversible`, names no family, so the switch scan missed it; its holes are MX socket spacing."

[[entry]]
slug     = "eek"
switches = ["alps", "choc_v1", "mx"]
note     = "README: \"compatible with MX, Alps, and Choc style switches\", with a picture marking each family's legs in the one footprint, `eek_Library:UnivSwitch_SK6812-Mini-E`. Its name gives no family; the pin reader (2026-11-16) found the Choc v1 pins and side posts, and rightly nothing else: Alps has no centre post to read from, and the MX pins sit on compromise MX/Alps positions."
[[entry]]
slug     = "aonami"
switches = ["choc_v1", "choc_v2"]
note     = "README: \"Choc v1/v2 hot swappable switches\". The footprint, `ceoloide:switch_choc_v1_v2`, read 2026-11-25: a 5.0 mm centre hole (Choc v2's post; a v1's smaller post fits it too), 1.9 mm side posts at +/-5.5, and the v1 hotswap socket's holes -- the evidence that makes foostan's `choc12` both families in extract_switch_footprints.STATED_FAMILIES. Not added there by name: ceoloide's footprint can be built without v2 support, which shrinks that hole, so the name alone proves nothing."
