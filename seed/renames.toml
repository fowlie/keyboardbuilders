# seed/renames.toml -- slugs that used to name a design, and what they name now.
#
# Forgejo #38. Ticket 07
# decision 8 is the ruling this file implements: **"slugs are mutable and old ones keep
# resolving. A machine-guessed name is a first draft too, so a rename leaves a redirect
# rather than a dead link."** That decision is resolved on the map, which is why #38's
# alternative -- strike the claim and accept dead links -- is not on the table here: it
# would reopen a closed ticket rather than pick the cheaper implementation.
#
# `build_seed.py` reads this file, checks it, and emits
# `src/main/resources/seed/renames.json` as a flat `was -> now` map. The checks are what
# make the file safe to hand a redirect:
#
#   * every `now` must name a design that CURRENTLY publishes -- a 301 to a 404 is worse
#     than the 404, because it hides which URL was wrong
#   * no `was` may be a live slug, or the redirect would shadow a real page
#   * chains resolve at build time, so the emitted map is always ONE hop. Rename a design
#     twice and both old URLs point at where it is now, not at each other.
#
# A REMOVAL GETS `now = false`, WHICH IS `sources.toml`'s OWN CONVENTION for "settled,
# and the answer is nothing". `bb3edf7` stopped publishing four `joric/jorne` and
# `idank/keyboards` fork copies, and `6440167` stopped publishing `ergl` and six
# `8-pack` duplicate pages. Those pages were WRONG. Redirecting them somewhere would be
# inventing a destination; a 404 says the true thing. The row still earns its place: it
# is the difference between a slug a person has ruled on and one nobody has looked at.
#
# So this file is the fate of EVERY slug that no longer names a design, and
# `scripts/check_slug_keys.py` is green only when each one has a row. It reports every
# slug-keyed row whose slug names no design and which live slugs it resembles; it cannot
# tell a rename from a removal, and that is exactly the ruling recorded here.

[[entry]]
