now  = "3w6"
why  = "e3ec84f, 2026-08-29. The drafter read the repo directory `3w6` and slugified it to `3-w6`, splitting the name at the digit; the design is spelled 3w6. FIRST RENAME AFTER THE SITE WENT LIVE, and the one that cost `position-scan.json` its entry silently -- the silhouette fell back from the board's own geometry to the QMK layout with no error anywhere"

