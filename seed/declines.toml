# --- Added 2026-08-20 by ticket 25: encoder-only devices. -------------------
# An encoder's integrated push-switch is not a switch position -- a position is
# something a switch mounts INTO. So these hold zero switch positions, which is
# ticket 17's rule verbatim, and the two models that declined anavi/knob1 on it
# were right where this map's special-casing was wrong.
#
# `no-switch-positions` over `not-a-keyboard` on purpose: both readmes call the
# device a "mini mechanical keyboard", so filing them as not-a-keyboard would
# record a disagreement with the source where the real ground is narrower and
# checkable. Ticket 33 has since made this the reason for the five rows above
# too -- see the file header.
#
# Explicit rows rather than leaving it to the gate, for ticket 17's reason: the
# gate rejects them only because the lexicon names nothing on the board, so a
# future lexicon token would walk them back in silently.
#
# `keys == number of rotary encoders` finds this class (5 records), but it is a
# CANDIDATE FILTER, NOT A VERDICT -- `minimacro5` matches 5/5 and is a real
# macropad, "a combination of rotary encoders and mechanical switches".
# `jpe230/big_knob` matches and is deliberately absent: its board file has not
# been read, and a decline row nobody checked is the thing this file is not for.

[[entry]]
tree     = "qmk"
id       = "anavi/knob1"
name     = "Knob 1"
source   = "AnaviTechnology/anavi-knob-1"
verdict  = "no_design"
reason   = "no-switch-positions"
signal   = "board-file"
stated   = "Rotary_Encoder:RotaryEncoder_Alps_EC11E-Switch_Vertical_H20mm"
note     = "the only input footprint placed on anavi-knob-1.kicad_pcb:227; no switch footprint anywhere on the board. QMK declares LAYOUT_k1 = 1 key on direct pin GP26 and one rotary encoder on GP27/GP28, so the single key IS the encoder's detent"

