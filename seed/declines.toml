# --- Added 2026-08-21 by ticket 26: six OverNumpad controller records, and the
# reason they were not here already. All six are replacement controllers for IBM
# and Unicomp buckling-spring keyboards, the class ticket 17 ruled out -- but they
# were INVISIBLE when ticket 36 wrote the five converter rows. They became visible
# only when the JSON5-tolerant parser landed in build_qmk_corpus.py that same
# evening, so the corpus grew underneath the decline list.
#
# That is the structural point worth keeping: this class can grow TWO ways -- a
# record appearing upstream, and an instrument being fixed beneath it -- and a
# record-keyed override file covers neither. Ticket 17's refusal of a lexicon RULE
# still stands, so what was added instead is a FLAG in draft_sources.py
# (`replacement_controller_flag`): a readme naming a `[controller]` under Hardware
# Availability. Measured 6/6 with zero false positives across 3,550 readmes; recall
# is 6 of 11, since the five converter rows above use no such block. It points, a
# human rules.
#
# One signal measured and REJECTED, recorded so nobody re-derives it: `manufacturer`
# containing a slash. It reads "Unicomp/Purdea Andrei" on all six, which looks
# decisive, but 26 records carry a slash and 20 are collaborations, reddit handles or
# a brand with a slash in it (`I/O Keyboards`, `Yiancar/CapsUnlocked`, `u/ergorius`).
# 6 of 26 is not an instrument.

