# seed/declines.toml -- firmware entries a human has ruled are not designs.
#
# Transcribed by hand from ticket 17 (the converter subtree) decision 3; the git
# commit is the credential. Every `stated` span was re-read from the primary
# source before it was written here, so a row is checkable without the ticket.
#
# This is an OVERRIDE FILE, NOT A CENSUS. A row exists only for a record that
# would otherwise REACH the publication gate -- i.e. one naming a third-party
# hardware repo. A decline row for a record nothing would publish is a claim
# nobody checked, so most of each class is deliberately absent.
#
# `reason` NAMES A PROPERTY, NEVER A CLASS -- rebuilt 2026-08-21 by ticket 33.
# The four reasons ticket 10 sketched had drifted from their examples: two had
# none left (`parametric-generator`, after the Dactyls' real reason turned out to
# be "no PCB", which ticket 37 then stopped being a reason at all; and
# `unnamed-collection`, since clog does name its members), and
# `replacement-controller` named a class where ticket 17's own argument was a
# property. So the set is now:
#
#   layout-not-its-own    the layout it publishes measures hardware it does not own
#   no-switch-positions   the board places no switch position at all
#   not-a-keyboard        the device's keys are incidental to what it is
#
# and nothing else until a row needs one. A class name belongs in `note`, where
# it describes the row rather than deciding it.
#
# `reason` RECORDS THE CHECK, NOT THE DESCRIPTION -- widened from two to three
# 2026-08-21 by ticket 38, one day after ticket 33 narrowed four to two, because
# `kinesis/kintwin` fits neither. Its thumb PCB may well hold switch positions
# (the file is Sprint Layout, unreadable), so declining it on their absence would
# be a confident negative; what IS measurable is that its 86 keys are a Kinesis
# Contoured's. Note anavi and kintwin decline for OPPOSITE reasons: ANAVI's one
# key is on its own board but is not a switch, kintwin's switches may be its own
# but the layout is not.
#
# Every row so far is `no-switch-positions`, from two classes:
#   * replacement controllers and protocol converters (ticket 17) -- 50 QMK
#     records, of which 5 have rows; the other 45 already fail corpus reach's
#     hardware gate.
#   * encoder-only devices (ticket 25) -- 5 candidate records, of which 2 have
#     rows. See the note above those rows for why the other 3 do not.
#
# `verdict` is the human's ruling, the same field sources.toml carries. There
# `drafted` means a machine proposed the row and no human has ruled yet; here
# every row is born ruled, because nothing drafted them. The build consumes rows
# whose verdict is not `drafted`. `reason` is a separate axis -- the decline
# taxonomy member -- so a future machine-proposed decline is writable as
# `verdict = "drafted"` alongside its proposed `reason`, with no collision.
#
# `signal` names WHICH source the span came from, so a row is checkable without
# the ticket that produced it:
#   `qmk-readme`     the record's own readme in qmk_firmware
#   `source-readme`  the hardware repo's own README
#   `board-file`     a footprint placed in the design's own .kicad_pcb, cited
#                    with file and line
# Ticket 17 labelled all five of its rows `readme`; four are QMK's and ctrl_m's is
# the hardware repo's, whose words are not in QMK's tree at all. A bare `readme`
# makes a row uncheckable against the local archive, which is why the value names
# the source class.
#
# `converter/xmk` is deliberately absent, and its reason matters. It is
# repo-backed (`manna-harbour/xmk`) and filed under `converter/`, so a prefix
# rule would have taken it -- but its readme says "Hardware Availability: No
# additional hardware required." It is firmware with no hardware of its own,
# which is corpus reach's already-ruled exclusion, not this one. Declining it
# here would record the wrong reason for the right outcome.

