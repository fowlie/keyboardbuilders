# --- Added 2026-08-21 by ticket 38: a hybrid, and the first `layout-not-its-own`
# row written for that reason rather than inherited. The controller PCB places
# ZERO switch footprints (25 placements: 8 Molex matrix connectors, 4 LEDs, 8
# resistors, 2 mounting holes, a pin header, a BlackPill socket, a logo). The
# thumb PCB EXISTS and is unreadable -- `thumb-pcb/thumb-pcb.lay6`, a Sprint
# Layout project -- so this is NOT declined for having no switch positions; it is
# declined because the 86 keys it publishes are the Kinesis Contoured's. The row
# exists because the gate is currently holding it out on a file format: add a
# Sprint Layout reader and it walks back in with someone else's layout.

