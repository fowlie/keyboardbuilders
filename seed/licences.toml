firmware      = ["GPL-3.0"]
documentation = ["CC0-1.0"]
verdict       = "confirmed"
signal        = "human"
note          = "Read 2026-10-01: Ferris's three-section LICENSE, kept whole. Hardware Solderpad 2.1, Software GPL v3 or later (\"contains changes to the original product ... Ferris under the GPL, version 3\"), Documentation CC0."

