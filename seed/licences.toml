repo          = "jyap808/pando"
hardware      = ["CERN-OHL-S-2.0"]
firmware      = ["GPL-2.0"]
documentation = ["CERN-OHL-S-2.0"]
verdict       = "confirmed"
signal        = "human"
note          = "2026-09-29, from the README's own License section, not a choice between files: \"Pando Keyboard (c) 2026 by Julian Yap is Open Hardware, licensed under CERN-OHL-S v2. See LICENSE.\" then \"The firmware in `firmware/` is licensed under the GPL v2.\" The root LICENSE is CERN-OHL-S only, which is why the build read that into all three slots. Documentation takes the project-wide grant; only the firmware is carved out."

# Ferris and its two descendants, 2026-10-01 (backlog #107). One LICENSE file with
# `# Hardware`, `# Software` and `# Documentation` sections, so one file states three
# licences and the scan could only name one. The hardware section's SPDX line is
# `Apache-2.0 WITH SHL-2.1`, the SPDX spelling of Solderpad 2.1; reading its first word
# published all three slots as Apache-2.0. scan_licences.py now reads the WITH clause.
[[entry]]
repo          = "pierrechevalier83/ferris"
hardware      = ["Solderpad-2.1"]
firmware      = ["GPL-3.0"]
documentation = ["CC0-1.0"]
verdict       = "confirmed"
signal        = "human"
note          = "Read 2026-10-01, the LICENSE's own sections: Hardware is the Solderpad Hardware License 2.1; Software is \"the GPL, version 3\" with \"or (at your option) any later version\"; Documentation is \"released to the public domain under the CC0 terms\". The readme says the same in one line."

[[entry]]
repo          = "jimmerricks/swoop"
